name: iOS TestFlight Deploy

# Builds Metricorex for iOS and uploads it to TestFlight using an
# App Store Connect API key (no Apple-ID password / 2FA anywhere).
# Setup: see docs/TESTFLIGHT_SETUP.md in the repo root.

on:
  workflow_dispatch: # manual "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "metroflow_flutter/lib/**"
      - "metroflow_flutter/ios/**"
      - "metroflow_flutter/pubspec.yaml"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

# GITHUB_TOKEN needs contents:write so `match` can push the encrypted
# signing material to the `ios-signing` branch.
permissions:
  contents: write

jobs:
  testflight:
    name: Build & upload to TestFlight
    # macos-15 (NOT macos-14): the Firebase iOS SDK resolved by SwiftPM now uses
    # Swift 6.1 features ("sending", access-level-on-imports). macos-14's newest
    # Xcode is too old to compile it (build fails in FIRAllocatedUnfairLock.swift
    # / HeartbeatStorage.swift). macos-15 ships Xcode 16.3+/26.x.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26+ (iOS 26 SDK + Swift 6.1 toolchain)
        run: |
          echo "Default Xcode:"
          xcodebuild -version
          echo "Available Xcodes on image:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP=""
          # Xcode 26.x is REQUIRED here:
          #  - device_info_plus 12.x calls NSProcessInfo.isiOSAppOnVision,
          #    which only exists in the iOS 26 SDK (Xcode 26).
          #  - the Firebase iOS SDK resolved by SwiftPM needs the Swift 6.1
          #    toolchain (Xcode 26 ships Swift 6.2, fully compatible).
          # Fall back to 16.4/16.3 only if 26.x is ever missing.
          for v in 26.4 26.3 26.2 26.1 26.0 16.4 16.3; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              XCODE_APP="/Applications/Xcode_${v}.app"
              break
            fi
          done
          if [ -z "$XCODE_APP" ]; then
            # Last resort: the image's default Xcode.
            XCODE_APP="/Applications/Xcode.app"
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "Active Xcode:"
          xcodebuild -version

      - name: Validate required GitHub secrets
        working-directory: metroflow_flutter/ios
        run: |
          missing=0
          for v in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub secret '$v' is not set — follow docs/TESTFLIGHT_SETUP.md (step 3) to add it."
              missing=1
            fi
          done
          exit $missing

      - name: Setup Flutter (same version as Android CI)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Install Flutter dependencies
        working-directory: metroflow_flutter
        run: flutter pub get

      - name: Ensure GoogleService-Info.plist exists (Firebase iOS config)
        working-directory: metroflow_flutter/ios
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -f Runner/GoogleService-Info.plist ]; then
            echo "Committed GoogleService-Info.plist found — OK."
          elif [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > Runner/GoogleService-Info.plist
            echo "Restored GoogleService-Info.plist from GOOGLE_SERVICE_INFO_PLIST_B64 secret."
          else
            echo "::error::GoogleService-Info.plist is missing (Firebase push would be dead)."
            echo "::error::Either commit it to metroflow_flutter/ios/Runner/ or set the GOOGLE_SERVICE_INFO_PLIST_B64 secret — see docs/TESTFLIGHT_SETUP.md (step 2)."
            exit 1
          fi

      - name: Write App Store Connect API key for xcodebuild cloud signing
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cp "AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Build Flutter iOS (AOT, unsigned)
        working-directory: metroflow_flutter
        continue-on-error: true
        env:
          # Flutter 3.44 builds iOS through Swift Package Manager by default.
          # With `--no-codesign`, the SPM-generated plugin package
          # (FlutterGeneratedPluginSwiftPackage) still demanded a Development
          # Team at the final embed/sign phase and aborted the build after the
          # full compile. The project is DE-MIGRATED from SPM in git, but
          # Flutter 3.44.x auto-migrates it back at build time — so we ALSO
          # (a) hand the embed phase a DEVELOPMENT_TEAM (inert with signing
          # disabled, but satisfies the "no team" validation), and
          # (b) continue-on-error: this step is a warm-up/cache step. The real
          # build is fastlane gym's SIGNED archive, which never hits this.
          # Signing stays hard-forced off at the xcodebuild level via the
          # FLUTTER_XCODE_* overrides.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          FLUTTER_XCODE_CODE_SIGN_STYLE: "Manual"
          # Google Sign-In iOS OAuth client (iOS-TYPE client). Injected as a
          # build-setting override so Info.plist's $(GOOGLE_IOS_CLIENT_ID) /
          # $(GOOGLE_IOS_URL_SCHEME) resolve at build time. The conditional
          # export below avoids overriding the GoogleSignIn.xcconfig defaults
          # with empty strings when the secrets are not configured.
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_URL_SCHEME: ${{ secrets.GOOGLE_IOS_URL_SCHEME }}
        run: |
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then export GOOGLE_IOS_CLIENT_ID; fi
          if [ -n "$GOOGLE_IOS_URL_SCHEME" ]; then export GOOGLE_IOS_URL_SCHEME; fi
          flutter config --no-enable-swift-package-manager
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          # This is a warm-up step: it compiles the Dart AOT so the signed gym
          # archive below reuses it. If the SPM embed/sign validation still
          # trips (Flutter 3.44 auto-migration), we do NOT fail the workflow —
          # fastlane's archive is fully signed (match profile + team) and
          # rebuilds everything itself. Flutter SDK errors (bad Dart code) are
          # still caught by the Android CI before this workflow is worth
          # running.
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} \
            || echo "::warning::flutter build (warm-up) failed — fastlane gym will perform the full signed build instead."

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: metroflow_flutter/ios

      - name: Create app (first run) + build, sign & upload to TestFlight
        working-directory: metroflow_flutter/ios
        env:
          # gym's `xcodebuild -showBuildSettings` needs >3s on this project.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
          # match: encrypted signing storage on the `ios-signing` branch.
          # MATCH_PASSWORD encrypts the cert/profile files in that branch
          # (repo is private; rotate via repo secrets if ever needed).
          MATCH_PASSWORD: "Metricorex-iOS-signing-2026-x7QkP92mVbT4wZsR"
          MATCH_KEYCHAIN_PASSWORD: "Metricorex-iOS-keychain-2026-j3NvL8hFdC6yWaGe"
          MATCH_GIT_URL: "https://x-access-token:${{ github.token }}@github.com/richdev2022/Metroflow-Mobile.git"
          # Google Sign-In iOS OAuth client — gym/xcodebuild read these as
          # build-setting overrides (same conditional-export guard as the
          # flutter build step above).
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_URL_SCHEME: ${{ secrets.GOOGLE_IOS_URL_SCHEME }}
        run: |
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then export GOOGLE_IOS_CLIENT_ID; fi
          if [ -n "$GOOGLE_IOS_URL_SCHEME" ]; then export GOOGLE_IOS_URL_SCHEME; fi
          bundle exec fastlane beta

      - name: Upload IPA artifact (backup copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricorex-ios-ipa
          path: metroflow_flutter/ios/build/ios/ipa/*.ipa
          if-no-files-found: ignore
