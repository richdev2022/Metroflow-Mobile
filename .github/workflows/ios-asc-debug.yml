name: iOS ASC Debug Dump

# Read-only diagnostic dump of the Metricorex App Store Connect state:
# app record, editable App Store version, localizations (description /
# keywords / URLs), attached build, app info (privacy policy). Used to find
# exactly what blocks "submit for review".
#
# Fires on any push that touches fastlane/asc_debug/** (commit a marker file
# there to run it). Read-only — never mutates anything.

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'fastlane/asc_debug/**'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane (spaceship)
        run: gem install fastlane --no-document

      - name: Write API key file
        run: |
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ["ASC_KEY_P8_B64"]
          try:
              pem = base64.b64decode(raw, validate=True).decode()
          except Exception:
              pem = raw
          key = {"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": pem, "in_house": False}
          with open(os.path.join(os.environ["RUNNER_TEMP"], "asc-api-key.json"), "w") as f:
              json.dump(key, f)
          print("key file written")
          PY

      - name: Dump App Store Connect state (read-only)
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/asc-api-key.json
        run: |
          pip install cryptography --quiet
          cat > "$RUNNER_TEMP/dump.py" <<'PY'
          import base64, json, os, time, urllib.request, urllib.parse
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import hashes

          key = json.load(open(os.environ["ASC_KEY_FILE"]))
          key_id, issuer = key["key_id"], key["issuer_id"]
          priv = load_pem_private_key(key["key"].encode(), password=None)

          def b64url(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          now = int(time.time())
          header = b64url(json.dumps({"alg": "ES256", "kid": key_id}).encode())
          payload = b64url(json.dumps({"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}).encode())
          der = priv.sign(f"{header}.{payload}".encode(), ec.ECDSA(hashes.SHA256()))
          # DER -> raw r||s
          r = int.from_bytes(der[4:4 + der[3]], "big"); s_off = 6 + der[3]; s_len = der[s_off - 1]
          s = int.from_bytes(der[s_off:s_off + s_len], "big")
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          TOKEN = f"{header}.{payload}.{b64url(sig)}"

          def get(path, **params):
              url = f"https://api.appstoreconnect.apple.com/v1/{path}"
              if params:
                  url += "?" + urllib.parse.urlencode({k: v for k, v in params.items() if v is not None})
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def show(d, fields):
              if not d: return
              a = d.get("attributes", {})
              print("   ", {f: a.get(f) for f in fields})

          APP_ID = "6818319166"

          print("=== APP INFO (privacy etc.) ===")
          try:
              infos = get(f"apps/{APP_ID}/appInfos").get("data", [])
              for info in infos:
                  print("   appInfo", info["id"], info["attributes"].get("state"))
                  locs = get(f"appInfos/{info['id']}/appInfoLocalizations").get("data", [])
                  for l in locs:
                      a = l["attributes"]
                      print("    loc", a.get("locale"), "name=", a.get("name"), "privacyPolicyUrl=", a.get("privacyPolicyUrl"), "privacyChoicesRequired=", a.get("privacyChoicesRequired"))
          except Exception as e:
              print("[APP INFO ERROR]", e)

          print("=== VERSIONS ===")
          vers = get(f"apps/{APP_ID}/appStoreVersions", limit=5).get("data", [])
          for v in vers:
              a = v["attributes"]
              print("   version", v["id"], "versionString=", a.get("versionString"), "state=", a.get("appVersionState"), "releaseType=", a.get("releaseType"))
              try:
                  locs = get(f"appStoreVersions/{v['id']}/appStoreVersionLocalizations").get("data", [])
                  for l in locs:
                      la = l["attributes"]
                      print("    loc", la.get("locale"), "whatsNew=", (la.get("whatsNew") or "")[:50], "description=", (la.get("description") or "EMPTY")[:50], "keywords=", la.get("keywords"), "supportUrl=", la.get("supportUrl"), "promoText=", la.get("promotionalText"))
              except Exception as e:
                  print("    [loc ERROR]", e)
              try:
                  builds = get("builds", **{"filter[app]": APP_ID, "filter[appStoreVersion]": v["id"], "limit": 5}).get("data", [])
                  if not builds: print("    BUILD ATTACHED: NONE")
                  for b in builds:
                      ba = b["attributes"]
                      print("    BUILD attached", b["id"], "v", ba.get("version"), "state=", ba.get("processingState"), "uploaded=", ba.get("uploadedDate"))
              except Exception as e:
                  print("    [builds ERROR]", e)

          print("=== ALL BUILDS (latest 8) ===")
          try:
              builds = get("builds", **{"filter[app]": APP_ID, "sort": "-uploadedDate", "limit": 8}).get("data", [])
              for b in builds:
                  ba = b["attributes"]
                  print("   build", b["id"], "v", ba.get("version"), "state=", ba.get("processingState"), "uploaded=", ba.get("uploadedDate"), "usesNonExemptEnc=", ba.get("usesNonExemptEncryption"))
          except Exception as e:
              print("[ALL BUILDS ERROR]", e)
          PY
          python3 "$RUNNER_TEMP/dump.py"

      - name: Cleanup API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.json"
