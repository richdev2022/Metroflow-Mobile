name: Store Production Release

# Tag-driven PRODUCTION release for BOTH stores.
#
# Trigger — push an annotated tag named store-release-<version>:
#   git tag -a store-release-1.0.0 -m "Metricorex 1.0.0"
#   git push origin store-release-1.0.0
#
# Android job: builds a signed AAB from the tagged commit and publishes it to
# the Google Play PRODUCTION track (status completed, 100% rollout) via
# fastlane supply + PLAY_SERVICE_ACCOUNT_JSON. Google review gates the live
# release; Play Console app-content declarations (data safety, content
# rating, privacy policy, target audience) must be complete or the release
# stays blocked in the console.
#
# iOS job: submits the latest PROCESSED TestFlight build for App Store review
# via fastlane deliver using the App Store Connect API key (no build step —
# TestFlight already holds the binary). No metadata or screenshots are
# uploaded; the App Store Connect listing is the source of truth and must be
# complete (screenshots, description, privacy policy) for Apple to accept the
# submission. Release after approval is automatic.
#
# versionCode strategy: GitHub run_number + 90000 — deterministic and
# strictly increasing per tag run, DISJOINT from flutter-build.yml
# (+1000) and android-play-internal.yml (+50000). Epoch seconds are
# FORBIDDEN: they produced ~1.79B codes and trip Play's "version code
# significantly higher than your previous version code" warning
# (Play cap: 2,100,000,000).

on:
  push:
    tags:
      - 'store-release-*'

permissions:
  contents: read

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  android-production:
    name: Play Store production publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      # Publishing REQUIRES the pinned release keystore — a debug-signed AAB
      # would be rejected by Play (and would burn a versionCode), so fail
      # hard instead of falling back like flutter-build.yml does.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — a release AAB cannot be signed without it."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/metricorex-release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/metricorex-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        working-directory: metroflow_flutter
        run: flutter pub get

      # Legacy pub plugins (video_thumbnail 0.5.6, ...) declare jcenter(),
      # which was REMOVED in Gradle 9 — this rewrite is a no-op while no
      # legacy plugin is present and cheap insurance if one gets added.
      - name: Patch legacy pub plugin repos (jcenter -> mavenCentral)
        run: find "$HOME/.pub-cache/hosted" -type f -path '*/android/build.gradle' -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

      # The app pins ndkVersion 28.2.13676358 (android/app/build.gradle.kts);
      # r28c is not preinstalled on the runner, so AGP downloads it via
      # sdkmanager DURING Gradle configuration — and that inline download is
      # flaky on CI ("Error on ZipFile unknown archive" when the zip lands
      # truncated). Install it HERE instead: sdkmanager with retries, then a
      # direct download of Google's official r28c zip as a last resort.
      # Idempotent — skips when the NDK is already present.
      - name: Install pinned NDK 28.2.13676358 (retry + fallback)
        run: |
          NDK_REV="28.2.13676358"
          NDK_DIR="/usr/local/lib/android/sdk/ndk/$NDK_REV"
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "NDK $NDK_REV already installed — skipping."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "--- sdkmanager attempt $attempt ---"
            if yes | "$SDKM" "ndk;$NDK_REV" > /tmp/ndk-sdkmanager.log 2>&1 \
               && [ -f "$NDK_DIR/source.properties" ]; then
              echo "NDK $NDK_REV installed via sdkmanager."
              exit 0
            fi
            echo "Attempt $attempt failed (tail of sdkmanager log):"
            tail -5 /tmp/ndk-sdkmanager.log || true
            # Clear partial download/extract state before retrying.
            sudo rm -rf "$NDK_DIR" "$SDK_ROOT/.temp" 2>/dev/null || true
            sleep 20
          done
          echo "--- sdkmanager failed 3x — direct download fallback ---"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -o /tmp/android-ndk-r28c.zip \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -tq /tmp/android-ndk-r28c.zip > /dev/null || { echo "::error::Downloaded NDK zip failed the integrity check"; exit 1; }
          unzip -q /tmp/android-ndk-r28c.zip -d /tmp/ndk-extract
          mkdir -p "$SDK_ROOT/ndk"
          sudo mv /tmp/ndk-extract/android-ndk-r28c "$NDK_DIR"
          [ -f "$NDK_DIR/source.properties" ] || { echo "::error::Fallback NDK install is incomplete"; exit 1; }
          echo "NDK $NDK_REV installed via direct download."

      - name: Compute versionCode
        run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 90000 ))" >> "$GITHUB_ENV"

      - name: Build signed AAB
        working-directory: metroflow_flutter
        run: flutter build appbundle --release --build-number=$VERSION_CODE

      - name: Prepare Play release notes
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          # Play changelogs are capped at 500 characters.
          head -c 500 RELEASE_NOTES.md > "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

      - name: Write service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set — paste the service-account JSON in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload AAB artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: metricorex-production-aab-${{ github.run_number }}
          path: metroflow_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # fastlane supply: creates an edit, uploads the AAB to the production
      # track, attaches the release notes, commits the edit. Google review
      # then gates the live rollout.
      - name: Publish to Play production track
        run: |
          fastlane supply \
            --json_key "$RUNNER_TEMP/play-service-account.json" \
            --package_name com.metricorex.app \
            --track production \
            --release_status completed \
            --aab "metroflow_flutter/build/app/outputs/bundle/release/app-release.aab" \
            --metadata_path fastlane/metadata \
            --skip_upload_images true \
            --skip_upload_screenshots true

      - name: Cleanup key material
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json" "$RUNNER_TEMP/metricorex-release.keystore"

  ios-appstore-submit:
    name: App Store review submission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same secrets the TestFlight workflow already uses successfully.
      # deliver 2.241.0 does NOT honor the APP_STORE_CONNECT_API_KEY_* env
      # vars in its option validation (it errors "No value found for
      # 'username'"), so the key is written to a JSON file and passed via
      # --api_key_path below.
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Validate App Store Connect secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub secret backing $v is not set — App Store submission cannot proceed."
              missing=1
            fi
          done
          exit $missing

      # Build the fastlane API-key JSON (key_id + issuer_id + PEM .p8 body).
      # The secret is the base64-encoded .p8 (see docs/TESTFLIGHT_SETUP.md);
      # fall back to treating it as raw PEM if it does not decode.
      - name: Write App Store Connect API key file
        run: |
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ["ASC_KEY_P8_B64"]
          try:
              pem = base64.b64decode(raw, validate=True).decode()
          except Exception:
              pem = raw
          if "BEGIN PRIVATE KEY" not in pem and "BEGIN RSA PRIVATE KEY" not in pem:
              raise SystemExit("ASC_KEY_P8_B64 does not contain a PEM private key")
          key = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": pem,
              "in_house": False,
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "asc-api-key.json")
          with open(path, "w") as f:
              json.dump(key, f)
          print("ASC API key file written")
          PY

      # deliver: no binary upload (the TestFlight build is already
      # processed), no metadata or screenshot upload (the App Store Connect
      # listing is the source of truth) — attach the latest build to the
      # editable version and submit for Apple review. --force skips the
      # interactive HTML-report prompt so the job never hangs on CI.
      # IDFA declared as NOT used: the app ships no ad SDK (no AdSupport /
      # admob / analytics-with-ads), so false is the correct declaration.
      - name: Submit latest TestFlight build for App Store review
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc-api-key.json" \
            --app_identifier com.metricorex.app \
            --platform ios \
            --skip_binary_upload \
            --skip_metadata \
            --skip_screenshots \
            --run_precheck_before_submit false \
            --submission_information '{"add_id_info_uses_idfa": false}' \
            --automatic_release \
            --force \
            --submit_for_review

      - name: Cleanup API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.json"
