name: Flutter Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Play Store track to upload to (internal / alpha / beta / production)'
        required: false
        default: 'internal'

# Serialize ALL Play uploads (with store-production-release.yml) —
# concurrent builds of the same commit computed the same epoch-seconds
# versionCode and raced for it ("Version code X has already been used").
# With this group, uploads are strictly sequential, so each build computes
# its versionCode minutes after the previous upload finished.
concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Present only when the user configured the Play Store service account
      # secret — the upload step keys off this to activate.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'

      - name: Install Dependencies
        working-directory: metroflow_flutter
        run: flutter pub get

      # Restore the pinned release keystore from GitHub secrets. When the
      # ANDROID_KEYSTORE_BASE64 secret is absent the step is skipped and the
      # build gracefully falls back to debug signing (gradle reads
      # ANDROID_KEYSTORE_PATH and only uses the release signing config when
      # the file exists — see android/app/build.gradle.kts).
      # Google Sign-In only works in artifacts signed by a keystore whose
      # SHA-1 is registered in the Google/Firebase console.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — falling back to debug signing (Google SSO will NOT work in this artifact)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/metricorex-release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/metricorex-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # versionCode = run_number + 1000 — small, strictly increasing, far
      # below Play's 2,100,000,000 cap. NEVER use date/epoch codes again:
      # date +%s (~1.79e9) burned five codes on the internal track
      # (1791920059..1791923832) and tripped Play's "version code
      # significantly higher than previous" warning; the space would be
      # exhausted by ~2036. Publishing is CENTRALIZED in
      # android-play-internal.yml (+50000) and store-production-release.yml
      # (+90000) — this workflow only builds artifacts.
      - name: Compute versionCode
        run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: metroflow_flutter
        run: flutter build apk --release --build-number=$VERSION_CODE

      - name: Build AAB
        working-directory: metroflow_flutter
        run: flutter build appbundle --release --build-number=$VERSION_CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: metroflow_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: metroflow_flutter/build/app/outputs/bundle/release/app-release.aab

      # ---------------------------------------------------------------------
      # DIRECT PLAY STORE PUSH — DISABLED (2026-10-14).
      # The internal track currently holds epoch-based versionCode
      # 1791923832, which this workflow's run_number+1000 codes can never
      # exceed — every upload would be rejected by Play. ALL Play publishing
      # is centralized: closed testing via android-play-internal.yml (push to
      # release/android-production-1.0), production via
      # store-production-release.yml (store-release-* tags).
      # ---------------------------------------------------------------------
      - name: Upload to Google Play (internal testing)
        if: false # was: env.PLAY_SERVICE_ACCOUNT_JSON != '' — see comment above
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.metricorex.app
          releaseFiles: metroflow_flutter/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed
          mappingFile: metroflow_flutter/build/app/outputs/mapping/release/mapping.txt
