name: Flutter Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Play Store track to upload to (internal / alpha / beta / production)'
        required: false
        default: 'internal'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Present only when the user configured the Play Store service account
      # secret — the upload step keys off this to activate.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'

      - name: Install Dependencies
        working-directory: metroflow_flutter
        run: flutter pub get

      # Restore the pinned release keystore from GitHub secrets. When the
      # ANDROID_KEYSTORE_BASE64 secret is absent the step is skipped and the
      # build gracefully falls back to debug signing (gradle reads
      # ANDROID_KEYSTORE_PATH and only uses the release signing config when
      # the file exists — see android/app/build.gradle.kts).
      # Google Sign-In only works in artifacts signed by a keystore whose
      # SHA-1 is registered in the Google/Firebase console.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — falling back to debug signing (Google SSO will NOT work in this artifact)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/metricorex-release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/metricorex-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # versionCode = UTC epoch SECONDS — ONE app-wide monotonic counter for
      # every Play publishing workflow (flutter-build / android-play-internal
      # / store-production-release). No cross-workflow coordination needed and
      # no upload can ever fall below the app-wide maximum (the old
      # run_number+offset schemes broke the moment a higher-offset build hit
      # production: every later +1000 upload would be rejected). Play's
      # 2,100,000,000 cap is safe until ~2036 (headroom 3e8 s).. Computed ONCE
      # here so the APK and AAB always share the same versionCode. Two uploads
      # within the same minute would collide — Play rejects the duplicate with
      # a clear error and a retry succeeds a minute later.
      - name: Compute versionCode
        run: echo "VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: metroflow_flutter
        run: flutter build apk --release --build-number=$VERSION_CODE

      - name: Build AAB
        working-directory: metroflow_flutter
        run: flutter build appbundle --release --build-number=$VERSION_CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: metroflow_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: metroflow_flutter/build/app/outputs/bundle/release/app-release.aab

      # ---------------------------------------------------------------------
      # DIRECT PLAY STORE PUSH — activates automatically once the repo secret
      # PLAY_SERVICE_ACCOUNT_JSON is set (a Google Play service-account JSON
      # key with release access, created in Play Console → Setup → API
      # access). Uploads the signed AAB to the given track (default:
      # internal testing) so releases reach testers without a manual console
      # upload. Requirement: the app must already EXIST in Play Console
      # (first upload is manual, Google requires it).
      # ---------------------------------------------------------------------
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.metricorex.app
          releaseFiles: metroflow_flutter/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed
          mappingFile: metroflow_flutter/build/app/outputs/mapping/release/mapping.txt
