name: Flutter Android Build

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'

      - name: Install Dependencies
        working-directory: Metricorex_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: Metricorex_flutter
        run: flutter build apk --release

      - name: Build AAB
        working-directory: Metricorex_flutter
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Metricorex_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: Metricorex_flutter/build/app/outputs/bundle/release/app-release.aab
