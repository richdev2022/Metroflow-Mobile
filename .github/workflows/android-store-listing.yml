name: Android Play Store Listing

# One-shot branch workflow: pushing to android-store-listing uploads the
# COMPLETE store listing — title, descriptions, app icon, feature graphic
# and phone screenshots — via fastlane supply (metadata-only: NO binary,
# the staged closed-testing draft release is not touched). Also sets the
# store contact details (email / phone / website) via edits.details.
#
# NOTE (console-only items the API cannot set):
#   App content (privacy policy URL, ads, content rating questionnaire,
#   target audience, data safety form, financial features declaration),
#   App access (review credentials), closed-track countries and testers.
#
on:
  push:
    branches:
      - android-store-listing
  workflow_dispatch:

concurrency:
  group: play-listing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth
        run: pip install google-api-python-client --quiet

      # Direct Play Developer API upload via the official client: listing
      # text, icon, feature graphic, phone screenshots, contact details.
      - name: Upload store listing via Play API
        run: |
          python3 - <<'PY'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          KEY = os.path.join(os.environ["RUNNER_TEMP"], "play-sa.json")
          META = "fastlane/metadata/android/en-US"
          PKG = "com.metricorex.app"

          creds = service_account.Credentials.from_service_account_file(
              KEY, scopes=["https://www.googleapis.com/auth/androidpublisher"])
          svc = build("androidpublisher", "v3", credentials=creds, cache_discovery=False)

          eid = svc.edits().insert(packageName=PKG, body={}).execute()["id"]
          print("edit:", eid)

          svc.edits().listings().update(
              packageName=PKG, editId=eid, language="en-US",
              body={"title": open(f"{META}/title.txt").read().strip(),
                    "shortDescription": open(f"{META}/short_description.txt").read().strip(),
                    "fullDescription": open(f"{META}/full_description.txt").read().strip()}
          ).execute()
          print("OK listing text")

          def upload(image_type, path):
              media = MediaFileUpload(path, mimetype="image/png")
              res = svc.edits().images().upload(
                  packageName=PKG, editId=eid, language="en-US",
                  imageType=image_type, media_body=media).execute()
              print("OK image", image_type, os.path.basename(path), "id=", res.get("image", {}).get("id"))

          for t in ("icon", "featureGraphic", "phoneScreenshots"):
              try:
                  svc.edits().images().deleteall(
                      packageName=PKG, editId=eid, language="en-US", imageType=t).execute()
                  print("cleared", t)
              except Exception as e:
                  print("clear", t, "(nothing to clear)")

          upload("icon", f"{META}/images/icon.png")
          upload("featureGraphic", f"{META}/images/featureGraphic.png")
          for name in sorted(os.listdir(f"{META}/images/phoneScreenshots")):
              if name.lower().endswith(".png"):
                  upload("phoneScreenshots", f"{META}/images/phoneScreenshots/{name}")

          svc.edits().details().update(
              packageName=PKG, editId=eid,
              body={"defaultLanguage": "en-US",
                    "contactEmail": "sunday@metricorex.com",
                    "contactPhone": "+234 816 334 9199",
                    "contactWebsite": "https://metricorex.com"}
          ).execute()
          print("OK contact details")

          svc.edits().commit(packageName=PKG, editId=eid).execute()
          print("STORE LISTING UPLOADED")
          PY

      - name: Cleanup key material
        if: always()
        run: rm -f "$RUNNER_TEMP/play-sa.json"
