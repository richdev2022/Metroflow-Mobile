name: Android Play Store Listing

# One-shot branch workflow: pushing to android-store-listing uploads the
# COMPLETE store listing — title, descriptions, app icon, feature graphic
# and phone screenshots — via fastlane supply (metadata-only: NO binary,
# the staged closed-testing draft release is not touched). Also sets the
# store contact details (email / phone / website) via edits.details.
#
# NOTE (console-only items the API cannot set):
#   App content (privacy policy URL, ads, content rating questionnaire,
#   target audience, data safety form, financial features declaration),
#   App access (review credentials), closed-track countries and testers.
#
on:
  push:
    branches:
      - android-store-listing
  workflow_dispatch:

concurrency:
  group: play-listing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth
        run: pip install google-auth requests --quiet

      # Direct Play Developer API upload (no fastlane): listing text,
      # icon, feature graphic, phone screenshots, contact details.
      - name: Upload store listing via Play API
        run: |
          python3 - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          KEY = os.path.join(os.environ["RUNNER_TEMP"], "play-sa.json")
          META = "fastlane/metadata/android/en-US"
          PKG = "com.metricorex.app"

          creds = service_account.Credentials.from_service_account_file(
              KEY, scopes=["https://www.googleapis.com/auth/androidpublisher"])
          s = AuthorizedSession(creds)
          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PKG}"

          eid = s.post(f"{base}/edits").json()["id"]
          print("edit:", eid)

          def must(resp, what):
              if resp.status_code >= 300:
                  raise SystemExit(f"FAIL {what}: {resp.status_code} {resp.text[:500]}")
              print("OK", what)

          # 1. listing text
          must(s.patch(f"{base}/edits/{eid}/listings/en-US", json={
              "title": open(f"{META}/title.txt").read().strip(),
              "shortDescription": open(f"{META}/short_description.txt").read().strip(),
              "fullDescription": open(f"{META}/full_description.txt").read().strip(),
          }), "listing text")

          # 2. images (replace all of each type, in order)
          # NOTE: binary media uploads go under Google's /upload/ path prefix.
          UP = "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/com.metricorex.app"

          def upload_image(image_type, path):
              with open(path, "rb") as fh:
                  r = s.post(f"{UP}/edits/{eid}/images/en-US",
                             params={"imageType": image_type, "uploadType": "media"},
                             data=fh.read(),
                             headers={"Content-Type": "image/png"})
              if r.status_code >= 300:
                  raise SystemExit(f"FAIL image {image_type} {os.path.basename(path)}: {r.status_code} {r.text[:400]}")
              try:
                  iid = r.json().get("id")
              except Exception:
                  iid = "?"
              print(f"OK image {image_type} {os.path.basename(path)} id={iid}")

          for image_type in ("icon", "featureGraphic", "phoneScreenshots"):
              # drop any existing images of this type first (404 = none yet, fine)
              d = s.delete(f"{base}/edits/{eid}/images/en-US", params={"imageType": image_type})
              print("clear", image_type, "->", d.status_code)
              if image_type == "icon":
                  upload_image(image_type, f"{META}/images/icon.png")
              elif image_type == "featureGraphic":
                  upload_image(image_type, f"{META}/images/featureGraphic.png")
              else:
                  for name in sorted(os.listdir(f"{META}/images/phoneScreenshots")):
                      if name.lower().endswith(".png"):
                          upload_image(image_type, f"{META}/images/phoneScreenshots/{name}")

          # 3. contact details
          must(s.patch(f"{base}/edits/{eid}/details", json={
              "defaultLanguage": "en-US",
              "contactEmail": "sunday@metricorex.com",
              "contactPhone": "+234 816 334 9199",
              "contactWebsite": "https://metricorex.com",
          }), "contact details")

          must(s.post(f"{base}/edits/{eid}:commit"), "commit")
          print("STORE LISTING UPLOADED")
          PY

      - name: Cleanup key material
        if: always()
        run: rm -f "$RUNNER_TEMP/play-sa.json"
