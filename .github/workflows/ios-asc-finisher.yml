name: iOS ASC Finisher

# One-shot branch workflow: pushing to ios-appstore-finish runs this.
#
# What it does, in order:
#   1. Sets App Review Information (appStoreReviewDetail) with the DEMO USER
#      credentials — metricorexlimited@gmail.com / Password@123 — replacing
#      the admin credentials that were mistakenly shared earlier.
#   2. Checks the 1.0 version state: attached build, screenshots per display
#      type, price schedule.
#   3. If screenshots + pricing are present, submits the build for App Store
#      review (same deliver invocation the tag workflow used — it reached
#      ASC's own validation, so the command is proven).
#   4. If screenshots/pricing are still missing, it does NOT submit and
#      prints exactly what must be added in App Store Connect.

on:
  push:
    branches:
      - ios-appstore-finish

concurrency:
  group: asc-finisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finish:
    name: Review info + state check + submit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      BUNDLE_ID: com.metricorex.app
      DEMO_USER: metricorexlimited@gmail.com
      DEMO_PASSWORD: Password@123
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Validate App Store Connect secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub secret backing $v is not set."
              missing=1
            fi
          done
          exit $missing

      - name: Write App Store Connect API key file
        run: |
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ["ASC_KEY_P8_B64"]
          try:
              pem = base64.b64decode(raw, validate=True).decode()
          except Exception:
              pem = raw
          if "BEGIN PRIVATE KEY" not in pem and "BEGIN RSA PRIVATE KEY" not in pem:
              raise SystemExit("ASC_KEY_P8_B64 does not contain a PEM private key")
          key = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": pem,
              "in_house": False,
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "asc-api-key.json")
          with open(path, "w") as f:
              json.dump(key, f)
          print("ASC API key file written")
          PY

      - name: Set review info (demo user) + check submission readiness
        id: check
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/asc-api-key.json
        run: |
          pip install cryptography --quiet
          cat > "$RUNNER_TEMP/finisher.py" <<'PY'
          import base64, json, os, time, urllib.request, urllib.parse, urllib.error
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import hashes

          key = json.load(open(os.environ["ASC_KEY_FILE"]))
          key_id, issuer = key["key_id"], key["issuer_id"]
          priv = load_pem_private_key(key["key"].encode(), password=None)

          def b64url(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          now = int(time.time())
          header = b64url(json.dumps({"alg": "ES256", "kid": key_id}).encode())
          payload = b64url(json.dumps({"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}).encode())
          der = priv.sign(f"{header}.{payload}".encode(), ec.ECDSA(hashes.SHA256()))
          r = int.from_bytes(der[4:4 + der[3]], "big"); s_off = 6 + der[3]; s_len = der[s_off - 1]
          s = int.from_bytes(der[s_off:s_off + s_len], "big")
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          TOKEN = f"{header}.{payload}.{b64url(sig)}"

          BASE = "https://api.appstoreconnect.apple.com/v1/"

          def call(method, path, body=None, **params):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode({k: v for k, v in params.items() if v is not None})
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method,
                                           headers={"Authorization": f"Bearer {TOKEN}",
                                                    "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  body_txt = e.read().decode(errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {e.code}: {body_txt[:1200]}")

          APP_ID = "6818319166"
          DEMO_USER = os.environ["DEMO_USER"]
          DEMO_PASSWORD = os.environ["DEMO_PASSWORD"]

          def rel_names(path):
              try:
                  doc = call("GET", path)
                  return list((doc.get("data", {}).get("relationships") or {}).keys())
              except Exception:
                  return []

          # ---- editable version ----
          vers = call("GET", f"apps/{APP_ID}/appStoreVersions",
                      **{"filter[appVersionState]": "PREPARE_FOR_SUBMISSION"}).get("data", [])
          if not vers:
              vers = call("GET", f"apps/{APP_ID}/appStoreVersions", limit=5).get("data", [])
          assert vers, "No editable App Store version found"
          version = vers[0]
          vid = version["id"]
          print("VERSION:", vid, version["attributes"].get("versionString"), version["attributes"].get("appVersionState"))

          # ---- App Review Information (the credential fix) ----
          try:
              detail = None
              try:
                  detail = call("GET", f"appStoreVersions/{vid}/appStoreReviewDetail").get("data")
              except Exception:
                  detail = None
              if not detail:
                  detail = call("POST", "appStoreReviewDetails", {
                      "data": {"type": "appStoreReviewDetails", "attributes": {},
                               "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": vid}}}}})
                  print("REVIEW DETAIL: created (was missing — this was blocking submission)")
              else:
                  print("REVIEW DETAIL: found", detail["id"])
              did = detail["id"]
              ddoc = call("GET", f"appStoreReviewDetails/{did}")
              existing = ddoc.get("data", {}).get("attributes") or {}
              print("REVIEW DETAIL ATTRS:", {k: ("***" if "assword" in k else v) for k, v in existing.items()})
              patch = {
                  "demoUser": DEMO_USER,
                  "demoPassword": DEMO_PASSWORD,
                  "demoRequired": True,
                  "notes": "Sign in with the provided demo account (a regular user account) to explore the app. No payment method is required to review Metricorex.",
              }
              if not (existing.get("contactFirstName") or "").strip(): patch["contactFirstName"] = "Metricorex"
              if not (existing.get("contactLastName") or "").strip(): patch["contactLastName"] = "Support"
              if not (existing.get("contactEmail") or "").strip(): patch["contactEmail"] = DEMO_USER
              if not (existing.get("contactPhone") or "").strip(): patch["contactPhone"] = "+234 800 000 0000"
              call("PATCH", f"appStoreReviewDetails/{did}", {
                  "data": {"type": "appStoreReviewDetails", "id": did, "attributes": patch}})
              print(f"REVIEW INFO: demo user set to {DEMO_USER} (admin credentials replaced)")
          except Exception as e:
              print("::error::Review-info update failed:", e)

          # ---- attached build ----
          try:
              builds = call("GET", "builds", **{"filter[app]": APP_ID, "filter[appStoreVersion]": vid, "limit": 1}).get("data", [])
              print("BUILD ATTACHED:", builds[0]["attributes"].get("version") if builds else "NONE")
          except Exception as e:
              print("[BUILD ERROR]", e)

          # ---- screenshots per display type (discover real relationship name) ----
          iphone_ok = ipad_ok = False
          try:
              locs = call("GET", f"appStoreVersions/{vid}/appStoreVersionLocalizations").get("data", [])
              en = next((l for l in locs if l["attributes"].get("locale") == "en-US"), locs[0])
              en_id = en["id"]
              # Discover the actual screenshots relationship from the resource doc
              loc_doc = call("GET", f"appStoreVersionLocalizations/{en_id}")
              loc_rels = list((loc_doc.get("data", {}).get("relationships") or {}).keys())
              print("LOC RELATIONSHIPS:", loc_rels)
              shots_rel = next((r for r in loc_rels if "creenshot" in r), None)
              by_type = {}
              if shots_rel:
                  sets = call("GET", f"appStoreVersionLocalizations/{en_id}/{shots_rel}", limit=200).get("data", [])
                  for st in sets:
                      dt = st["attributes"].get("screenshotDisplayType") or "UNKNOWN"
                      st_type = st["type"]
                      st_id = st["id"]
                      st_rels = rel_names(f"{st_type}/{st_id}")
                      sub_rel = next((r for r in st_rels if "creenshot" in r), None)
                      n = 0
                      if sub_rel:
                          try:
                              n = len(call("GET", f"{st_type}/{st_id}/{sub_rel}", limit=200).get("data", []))
                          except Exception:
                              n = 0
                      if n:
                          by_type[dt] = by_type.get(dt, 0) + n
              print("SCREENSHOTS (en-US):", json.dumps(by_type, indent=2))
              iphone_ok = any(n > 0 and any(x in dt for x in ("IPHONE_67", "IPHONE_69", "IPHONE_65")) for dt, n in by_type.items())
              ipad_ok = any(n > 0 and ("IPAD_13" in dt or "IPAD_PRO_3GEN_13" in dt or "IPAD_PRO_129" in dt) for dt, n in by_type.items())
              print("IPHONE LARGE SET:", "OK" if iphone_ok else "MISSING (iPhone 6.9\"/Dynamic Island screenshots required)")
              print("IPAD 13 SET:", "OK" if ipad_ok else "MISSING (iPad Pro 13\" screenshots required)")
          except Exception as e:
              print("[SCREENSHOT ERROR]", e)

          # ---- pricing ----
          pricing_ok = False
          try:
              sched = call("GET", f"apps/{APP_ID}/appPriceSchedule").get("data")
              pricing_ok = bool(sched)
          except Exception:
              try:
                  ap = call("GET", "appPrices", **{"filter[app]": APP_ID}).get("data", [])
                  pricing_ok = len(ap) > 0
              except Exception as e:
                  print("[PRICING ERROR]", e)
          print("PRICING:", "SET" if pricing_ok else "NOT SET — set a price tier in ASC (e.g. Free)")

          ready = bool(iphone_ok and ipad_ok and pricing_ok)
          print("READY FOR SUBMISSION:", ready)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ready={'true' if ready else 'false'}\nversion_id={vid}\n")
          if not ready:
              print("::warning::NOT submitting — add the missing screenshots / pricing in App Store Connect, then re-run this workflow.")
          PY
          python3 "$RUNNER_TEMP/finisher.py"

      - name: Submit for App Store review
        if: steps.check.outputs.ready == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc-api-key.json
        run: |
          fastlane deliver \
            --api_key_path "$ASC_KEY_PATH" \
            --app_identifier com.metricorex.app \
            --platform ios \
            --skip_binary_upload \
            --skip_metadata \
            --skip_screenshots \
            --run_precheck_before_submit false \
            --submission_information '{"add_id_info_uses_idfa": false}' \
            --automatic_release \
            --force \
            --submit_for_review

      - name: Cleanup API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.json" "$RUNNER_TEMP/finisher.py"
