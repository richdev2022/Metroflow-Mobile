name: metricorex_flutter
description: Metricorex business management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  go_router: ^17.2.3
  local_auth: ^3.0.1
  google_fonts: ^6.2.1
  # ^1.1.0 = first release with ImagePicker.pickMedia (single photo OR video
  # pick for chat attachments). Pub resolves the newest 1.x the CI SDK allows.
  image_picker: ^1.1.0
  # Chat attachment playback (full-screen video player page).
  video_player: ^2.9.2
  # Opens downloaded chat documents with a native app (PDFs, Office, ...).
  open_filex: ^4.5.0
  fluttertoast: ^9.1.0
  share_plus: ^12.0.2
  webview_flutter: ^4.7.0
  url_launcher: ^6.3.1
  web: ^1.1.1
  excel: ^4.0.3
  file_picker: ^10.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  fl_chart: ^0.70.2
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^5.2.1
  socket_io_client: ^2.0.3+1
  timezone: ^0.9.4
  flutter_webrtc: ^1.5.2
  audioplayers: ^6.1.0
  record: ^7.1.1
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  # FCM push notifications (incoming calls/messages while app is closed).
  # firebase_messaging 15.x works with firebase_core 3.x on Flutter >=3.3.
  # flutter_local_notifications 18.x has the widest SDK window (Dart ^3.1,
  # Flutter >=3.13) so it resolves on the CI Flutter (3.44.x) and older too.
  # NOTE: no google-services.json / GoogleService-Info.plist is committed —
  # PushNotificationService degrades to a no-op when Firebase config is absent.
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  # Launcher badge (flutter_app_badger is discontinued & Dart-2-only; this is
  # the maintained Dart-3 equivalent with the same iOS/Android coverage).
  app_badge_plus: ^1.3.5
  # Runtime permission prompts (notifications/camera/mic/photos primer sheet).
  permission_handler: ^11.3.1
  mediasoup_client_flutter:
    path: third_party/mediasoup_client_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  mocktail: ^1.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appIcon.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/appIcon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - .env
